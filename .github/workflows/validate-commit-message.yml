name: Validate Commit Messages After Merge

on:
  push:
    branches:
      - develop
      - bat
      - release
      - main

jobs:
  validate-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit messages
        run: |
          echo "Validating commit messages for push to ${{ github.ref }}"

          # Get the list of commits in this push
          COMMITS=$(jq -r '.commits[].message' <<< "${{ toJson(github.event) }}")

          echo "Commits:"
          echo "$COMMITS"

          # Loop through each commit message
          while IFS= read -r MSG; do
            echo "Checking: $MSG"

            # Feature & hotfix commits (squash merges)
            if [[ "$MSG" =~ ^(feat|fix)(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
              echo "✔ Valid feature/hotfix commit"
              continue
            fi

            # Promotion commits (merge commits)
            if [[ "$MSG" =~ ^chore\(release\):\ promote\ ([a-z]+)\ to\ ([a-z]+)$ ]]; then
              SRC_ENV="${BASH_REMATCH[1]}"
              TGT_ENV="${BASH_REMATCH[2]}"

              # Validate allowed promotion paths
              if [[ "$SRC_ENV" == "develop" && "$TGT_ENV" != "bat" ]]; then
                echo "❌ Invalid promotion: develop can only promote to bat"
                exit 1
              fi
              if [[ "$SRC_ENV" == "bat" && "$TGT_ENV" != "release" ]]; then
                echo "❌ Invalid promotion: bat can only promote to release"
                exit 1
              fi
              if [[ "$SRC_ENV" == "release" && "$TGT_ENV" != "main" ]]; then
                echo "❌ Invalid promotion: release can only promote to main"
                exit 1
              fi

              echo "✔ Valid promotion commit"
              continue
            fi

            echo "❌ Invalid commit message format: $MSG"
            exit 1

          done <<< "$COMMITS"

          echo "✔ All commit messages are valid"