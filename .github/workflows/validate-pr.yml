name: Validate PR Naming & Merge Rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and merge rules
        run: |
          SRC="${{ github.head_ref }}"
          TGT="${{ github.base_ref }}"
          TITLE="${{ github.event.pull_request.title }}"

          echo "Source branch: $SRC"
          echo "Target branch: $TGT"
          echo "PR Title: $TITLE"

          # -------------------------------
          # FEATURE BRANCH RULES
          # -------------------------------
          if [[ "$SRC" == feature/* ]]; then
            # Feature branches can ONLY merge into develop
            if [[ "$TGT" != "develop" ]]; then
              echo "❌ Feature branches can only merge into develop."
              exit 1
            fi

            # Title must follow Conventional Commits feat:/fix:
            if ! [[ "$TITLE" =~ ^(feat|fix)(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
              echo "❌ Invalid PR title for feature → develop."
              echo "Expected: feat: xxx or fix: xxx (scope optional)"
              exit 1
            fi
          fi

          # -------------------------------
          # HOTFIX RULES
          # -------------------------------
          if [[ "$SRC" == hotfix/* ]]; then
            if [[ "$TGT" != "develop" && "$TGT" != "bat" && "$TGT" != "release" ]]; then
              echo "❌ hotfix branches can only merge into develop, bat, or release."
              exit 1
            fi

            # Hotfix naming should follow fix:
            if ! [[ "$TITLE" =~ ^fix(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
              echo "❌ Hotfix PR titles must start with fix: or fix(scope):"
              exit 1
            fi
          fi

          # -------------------------------
          # PROMOTION PR RULES (Conventional Commits)
          # -------------------------------
          if [[ "$TITLE" =~ ^chore\(release\):\ promote\ ([a-z]+)\ to\ ([a-z]+)$ ]]; then
            SRC_ENV="${BASH_REMATCH[1]}"
            TGT_ENV="${BASH_REMATCH[2]}"

            echo "Detected promotion: $SRC_ENV → $TGT_ENV"

            # Validate allowed promotion paths
            if [[ "$SRC_ENV" == "develop" && "$TGT_ENV" != "bat" ]]; then
              echo "❌ develop can only be promoted to bat."
              exit 1
            fi

            if [[ "$SRC_ENV" == "bat" && "$TGT_ENV" != "release" ]]; then
              echo "❌ bat can only be promoted to release."
              exit 1
            fi

            if [[ "$SRC_ENV" == "release" && "$TGT_ENV" != "main" ]]; then
              echo "❌ release can only be promoted to main."
              exit 1
            fi

            # Ensure PR target matches the promotion target
            if [[ "$TGT" != "$TGT_ENV" ]]; then
              echo "❌ PR target branch ($TGT) does not match promotion target ($TGT_ENV)."
              exit 1
            fi
          fi

          # -------------------------------
          # MERGE PATH RULES (Global)
          # -------------------------------

          # Develop → only bat
          if [[ "$SRC" == "develop" && "$TGT" != "bat" ]]; then
            echo "❌ develop can only merge into bat."
            exit 1
          fi

          # BAT → only release
          if [[ "$SRC" == "bat" && "$TGT" != "release" ]]; then
            echo "❌ bat can only merge into release."
            exit 1
          fi

          # Release → only main
          if [[ "$SRC" == "release" && "$TGT" != "main" ]]; then
            echo "❌ release can only merge into main."
            exit 1
          fi

          echo "✔ All PR naming and merge rules validated successfully."